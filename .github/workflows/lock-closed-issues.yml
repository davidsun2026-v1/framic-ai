- name: Lock Closed Issues and PRs
        uses: dessant/lock-threads@v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Only process issues/PRs — v6 handles discussions by default,
          # which would need an extra `discussions: write` permission
          process-only: issues, prs
          # Number of days of inactivity before locking a closed issue (set to 30 days)
          issue-inactive-days: 30
          # Number of days of inactivity before locking a closed PR (set to 30 days)
          pr-inactive-days: 30
          # Exclude items with specific labels if needed (optional)
          # exclude-issue-labels: ""
          # exclude-pr-labels: ""
          # Optional comment to post when locking
          issue-comment: >
            This issue has been automatically locked since there has been no recent activity after it was closed. 
            Please open a new issue for related bugs.
          pr-comment: >
            This pull request has been automatically locked since there has been no recent activity after it was closed.
