name: Lock Closed Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-closed-issues
  cancel-in-progress: false

jobs:
  lock-threads:
    name: Lock inactive closed issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lock Closed Issues and PRs
        uses: dessant/lock-threads@v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          process-only: "issues, prs"
          issue-inactive-days: "30"
          pr-inactive-days: "30"
          issue-lock-reason: resolved
          pr-lock-reason: resolved
          issue-comment: >
            This issue has been automatically locked because it has been closed
            and inactive for at least 30 days. Please open a new issue for a
            related bug or follow-up.
          pr-comment: >
            This pull request has been automatically locked because it has been
            closed and inactive for at least 30 days.
